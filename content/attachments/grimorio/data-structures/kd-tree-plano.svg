  <text x="140.4" y="101" class="op">[2, 6]</text>
  <circle cx="440" cy="200" r="4" class="accent-arrow-fill"/>
  <text x="474.3" y="191" class="op">[13, 3]</text>
  <circle cx="140" cy="260" r="4" class="accent-arrow-fill"/>
