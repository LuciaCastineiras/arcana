  <rect x="690" y="70" width="56" height="120" rx="6" class="frame"/>
  <line x1="724" y1="70" x2="724" y2="190" class="divider"/>
  <line x1="724" y1="110" x2="746" y2="110" class="divider"/>
  <line x1="724" y1="150" x2="746" y2="150" class="divider"/>
