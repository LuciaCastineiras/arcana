<svg width="850" height="220" viewBox="0 0 850 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame        { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .divider      { stroke: #9baec8; stroke-width: 1; }
    .val-sm       { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .link         { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .link-fill    { fill: #9baec8; }
    .idx          { font-size: 12px; fill: #777777; text-anchor: middle; }
    .op           { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .cell-null    { fill: #fff4e6; stroke: #c0742a; stroke-width: 1.5; stroke-dasharray: 5,3; }
    .char-null    { font-size: 16px; font-weight: 700; fill: #a0522d; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .frame        { fill: #1e2330; stroke: #4a6fa5; }
      .divider      { stroke: #4a6fa5; }
      .val-sm       { fill: #e2e8f0; }
      .link         { stroke: #4a6fa5; }
      .link-fill    { fill: #4a6fa5; }
      .idx          { fill: #8899aa; }
      .op           { fill: #8899aa; }
      .cell-null    { fill: #2a1f10; stroke: #d4884a; }
      .char-null    { fill: #d4884a; }
    }
  </style>

  <!-- niveles -->
  <text x="30" y="174" class="idx">Nivel 0</text>
  <text x="30" y="134" class="idx">Nivel 1</text>
  <text x="30" y="94" class="idx">Nivel 2</text>
  <text x="30" y="54" class="idx">Nivel 3</text>

