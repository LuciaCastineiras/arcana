<svg width="600" height="330" viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame        { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .val-sm       { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .link         { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .op           { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .idx          { font-size: 12px; fill: #777777; text-anchor: middle; }
    .accent-arrow { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .query        { fill: #f5f7fa; stroke: #c0742a; stroke-width: 1.8; }
    .ghost        { fill: #f5f7fa; fill-opacity: 0.5; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .ghost-val    { font-size: 16px; font-weight: 700; fill: #555555; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .frame        { fill: #1e2330; stroke: #4a6fa5; }
      .val-sm       { fill: #e2e8f0; }
      .link         { stroke: #4a6fa5; }
      .op           { fill: #8899aa; }
      .idx          { fill: #8899aa; }
      .accent-arrow { stroke: #d4884a; }
      .query        { fill: #1e2330; stroke: #d4884a; }
      .ghost        { fill: #1e2330; stroke: #8899aa; }
      .ghost-val    { fill: #aab4c0; }
    }
  </style>

  <!-- aristas -->
  <line x1="317" y1="70.6" x2="403" y2="124.4" class="link"/>
  <line x1="192.5" y1="150.6" x2="227.5" y2="194.4" class="link"/>
  <line x1="432.5" y1="150.6" x2="467.5" y2="194.4" class="link"/>

  <!-- ruta de descenso al insertar 10: 30 -> 20 -> 10 -->
  <line x1="283" y1="70.6" x2="197" y2="124.4" class="accent-arrow"/>
  <line x1="167.5" y1="150.6" x2="132.5" y2="194.4" class="accent-arrow"/>

  <!-- nodos -->
  <circle cx="300" cy="60" r="20" class="query"/>
  <text x="300" y="65" class="val-sm">30</text>
  <circle cx="180" cy="135" r="20" class="query"/>
  <text x="180" y="140" class="val-sm">20</text>
  <circle cx="420" cy="135" r="20" class="frame"/>
  <text x="420" y="140" class="val-sm">40</text>
  <circle cx="120" cy="210" r="20" class="ghost"/>
  <text x="120" y="216" class="ghost-val">10</text>
  <circle cx="240" cy="210" r="20" class="frame"/>
  <text x="240" y="215" class="val-sm">25</text>
  <circle cx="480" cy="210" r="20" class="frame"/>
  <text x="480" y="215" class="val-sm">50</text>
  <text x="348" y="64" class="idx">FB +1</text>
  <text x="132" y="139" class="idx">FB +1</text>
  <text x="468" y="139" class="idx">FB -1</text>
  <text x="72" y="214" class="idx">FB 0</text>
  <text x="288" y="214" class="idx">FB 0</text>
  <text x="528" y="214" class="idx">FB 0</text>

  <!-- leyenda -->
  <rect x="160" y="258" width="280" height="60" rx="6" class="frame"/>
  <circle cx="182" cy="276" r="8" class="query"/>
  <text x="299.4" y="280" class="op">ruta de descenso (30 → 20)</text>
  <circle cx="182" cy="300" r="8" class="ghost"/>
  <text x="272.1" y="304" class="op">nodo insertado (10)</text>
</svg>
