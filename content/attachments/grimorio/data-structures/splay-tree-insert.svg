<svg width="480" height="150" viewBox="0 0 480 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame        { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .val-sm       { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .link         { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .op           { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .op-arrow     { stroke: #777777; stroke-width: 1.5; fill: none; }
    .op-arrow-fill { fill: #777777; }
    .query        { fill: #f5f7fa; stroke: #c0742a; stroke-width: 1.8; }
    @media (prefers-color-scheme: dark) {
      .frame        { fill: #1e2330; stroke: #4a6fa5; }
      .val-sm       { fill: #e2e8f0; }
      .link         { stroke: #4a6fa5; }
      .op           { fill: #8899aa; }
      .op-arrow     { stroke: #8899aa; }
      .op-arrow-fill { fill: #8899aa; }
      .query        { fill: #1e2330; stroke: #d4884a; }
    }
  </style>

  <!-- paso 0 -->
  <text x="40" y="22" class="op">antes</text>
  <circle cx="40" cy="50" r="20" class="frame"/>
  <text x="40" y="55" class="val-sm">10</text>
  <line x1="75" y1="90" x2="145" y2="90" class="op-arrow"/>
  <path d="M145,95 L155,90 L145,85 Z" class="op-arrow-fill"/>
  <text x="115" y="62" class="op">insertar 20</text>
  <text x="115" y="78" class="op">como en un BST</text>

  <!-- paso 1 -->
  <text x="215" y="22" class="op">insertado</text>
  <line x1="202.8" y1="65.4" x2="227.2" y2="94.6" class="link"/>
  <circle cx="190" cy="50" r="20" class="frame"/>
  <text x="190" y="55" class="val-sm">10</text>
  <circle cx="240" cy="110" r="20" class="query"/>
  <text x="240" y="115" class="val-sm">20</text>
  <line x1="275" y1="90" x2="345" y2="90" class="op-arrow"/>
  <path d="M345,95 L355,90 L345,85 Z" class="op-arrow-fill"/>
  <text x="315" y="62" class="op">splay(20)</text>
  <text x="315" y="78" class="op">zig: rota 10</text>

  <!-- paso 2 -->
  <text x="415" y="22" class="op">después</text>
  <line x1="427.2" y1="65.4" x2="402.8" y2="94.6" class="link"/>
  <circle cx="440" cy="50" r="20" class="query"/>
  <text x="440" y="55" class="val-sm">20</text>
  <circle cx="390" cy="110" r="20" class="frame"/>
  <text x="390" y="115" class="val-sm">10</text>
</svg>
