<svg width="480" height="345" viewBox="0 0 480 345" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame        { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .divider      { stroke: #9baec8; stroke-width: 1; }
    .val          { font-size: 20px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .val-sm       { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .idx          { font-size: 12px; fill: #777777; text-anchor: middle; }
    .op           { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .op-arrow     { stroke: #777777; stroke-width: 1.5; fill: none; }
    .op-arrow-fill { fill: #777777; }
    .accent-arrow { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .accent-arrow-fill { fill: #c0742a; }
    .query        { fill: #f5f7fa; stroke: #c0742a; stroke-width: 1.8; }
    @media (prefers-color-scheme: dark) {
      .frame        { fill: #1e2330; stroke: #4a6fa5; }
      .divider      { stroke: #4a6fa5; }
      .val          { fill: #e2e8f0; }
      .val-sm       { fill: #e2e8f0; }
      .idx          { fill: #8899aa; }
      .op           { fill: #8899aa; }
      .op-arrow     { stroke: #8899aa; }
      .op-arrow-fill { fill: #8899aa; }
      .accent-arrow { stroke: #d4884a; }
      .accent-arrow-fill { fill: #d4884a; }
      .query        { fill: #1e2330; stroke: #d4884a; }
    }
  </style>

  <!-- elemento -->
  <rect x="180" y="20" width="120" height="36" rx="6" class="query"/>
  <text x="240" y="43" class="val-sm">"manzana"</text>

  <!-- se aplica cada función de hash -->
  <path d="M240,56 L240,72 L110,72 L110,100" class="op-arrow"/>
  <path d="M105,100 L110,110 L115,100 Z" class="op-arrow-fill"/>
  <path d="M240,56 L240,72 L240,72 L240,100" class="op-arrow"/>
  <path d="M235,100 L240,110 L245,100 Z" class="op-arrow-fill"/>
  <path d="M240,56 L240,72 L420,72 L420,100" class="op-arrow"/>
  <path d="M415,100 L420,110 L425,100 Z" class="op-arrow-fill"/>
  <rect x="55" y="110" width="110" height="34" rx="6" class="frame"/>
  <text x="110" y="131" class="op">Hash 1</text>
  <rect x="185" y="110" width="110" height="34" rx="6" class="frame"/>
  <text x="240" y="131" class="op">Hash 2</text>
  <rect x="365" y="110" width="110" height="34" rx="6" class="frame"/>
  <text x="420" y="131" class="op">Hash K</text>
  <text x="330" y="131" class="op">...</text>

  <!-- cada hash elige una posición del arreglo -->
  <path d="M110,144 L110,190 L115,210 L115,236" class="accent-arrow"/>
  <path d="M110,236 L115,246 L120,236 Z" class="accent-arrow-fill"/>
  <path d="M240,144 L240,190 L215,210 L215,236" class="accent-arrow"/>
  <path d="M210,236 L215,246 L220,236 Z" class="accent-arrow-fill"/>
  <path d="M420,144 L420,190 L415,210 L415,236" class="accent-arrow"/>
  <path d="M410,236 L415,246 L420,236 Z" class="accent-arrow-fill"/>

  <!-- arreglo de bits -->
  <rect x="40" y="250" width="400" height="40" rx="6" class="frame"/>
  <text x="65" y="277" class="val">0</text>
  <text x="65" y="310" class="idx">0</text>
  <line x1="90" y1="250" x2="90" y2="290" class="divider"/>
  <rect x="93" y="253" width="44" height="34" rx="6" class="query"/>
  <text x="115" y="277" class="val">1</text>
  <text x="115" y="310" class="idx">1</text>
  <line x1="140" y1="250" x2="140" y2="290" class="divider"/>
  <text x="165" y="277" class="val">0</text>
  <text x="165" y="310" class="idx">2</text>
  <line x1="190" y1="250" x2="190" y2="290" class="divider"/>
  <rect x="193" y="253" width="44" height="34" rx="6" class="query"/>
  <text x="215" y="277" class="val">1</text>
  <text x="215" y="310" class="idx">3</text>
  <line x1="240" y1="250" x2="240" y2="290" class="divider"/>
  <text x="265" y="277" class="val">0</text>
  <text x="265" y="310" class="idx">4</text>
  <line x1="290" y1="250" x2="290" y2="290" class="divider"/>
  <text x="315" y="277" class="val">0</text>
  <text x="315" y="310" class="idx">5</text>
  <line x1="340" y1="250" x2="340" y2="290" class="divider"/>
  <text x="365" y="277" class="val">0</text>
  <text x="365" y="310" class="idx">6</text>
  <line x1="390" y1="250" x2="390" y2="290" class="divider"/>
  <rect x="393" y="253" width="44" height="34" rx="6" class="query"/>
  <text x="415" y="277" class="val">1</text>
  <text x="415" y="310" class="idx">7</text>
  <text x="240" y="332" class="op">arreglo de bits (N posiciones)</text>
</svg>
