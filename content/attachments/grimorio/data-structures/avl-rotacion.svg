<svg width="820" height="320" viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame        { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .val-sm       { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .link         { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .op           { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .accent-label { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .accent-arrow { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .accent-arrow-fill { fill: #c0742a; }
    .query        { fill: #f5f7fa; stroke: #c0742a; stroke-width: 1.8; }
    .ghost        { fill: #f5f7fa; fill-opacity: 0.5; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .ghost-val    { font-size: 16px; font-weight: 700; fill: #555555; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .frame        { fill: #1e2330; stroke: #4a6fa5; }
      .val-sm       { fill: #e2e8f0; }
      .link         { stroke: #4a6fa5; }
      .op           { fill: #8899aa; }
      .accent-label { fill: #d4884a; }
      .accent-arrow { stroke: #d4884a; }
      .accent-arrow-fill { fill: #d4884a; }
      .query        { fill: #1e2330; stroke: #d4884a; }
      .ghost        { fill: #1e2330; stroke: #8899aa; }
      .ghost-val    { fill: #aab4c0; }
    }
  </style>

  <!-- antes: desbalance LL -->
  <text x="210" y="35" class="op">Desbalance LL</text>
  <line x1="264.2" y1="102.3" x2="205.8" y2="147.7" class="link"/>
  <line x1="294.1" y1="104.1" x2="335.9" y2="145.9" class="link"/>
  <line x1="174.9" y1="173.2" x2="125.1" y2="216.8" class="link"/>
  <line x1="100.1" y1="247.4" x2="79.9" y2="282.6" class="link"/>
  <line x1="119.9" y1="247.4" x2="140.1" y2="282.6" class="link"/>
  <line x1="199.9" y1="177.4" x2="220.1" y2="212.6" class="ghost"/>
  <circle cx="280" cy="90" r="20" class="query"/>
  <text x="280" y="95" class="val-sm">Z</text>
  <circle cx="190" cy="160" r="20" class="frame"/>
  <text x="190" y="165" class="val-sm">Y</text>
  <circle cx="350" cy="160" r="17" class="frame"/>
  <text x="350" y="165" class="val-sm">T4</text>
  <circle cx="110" cy="230" r="20" class="frame"/>
  <text x="110" y="235" class="val-sm">X</text>
  <circle cx="230" cy="230" r="17" class="ghost"/>
  <text x="230" y="236" class="ghost-val">T3</text>
  <circle cx="70" cy="300" r="17" class="frame"/>
  <text x="70" y="305" class="val-sm">T1</text>
  <circle cx="150" cy="300" r="17" class="frame"/>
  <text x="150" y="305" class="val-sm">T2</text>
  <text x="328" y="82" class="accent-label">FB = +2</text>
  <text x="140" y="152" class="accent-label">FB = +1</text>
  <text x="230" y="270" class="op">pasa a Z</text>

  <!-- rotación derecha -->
  <path d="M390,190 Q420,150 448,184" class="accent-arrow"/>
  <path d="M441,186 L452,196 L454,181 Z" class="accent-arrow-fill"/>
  <text x="420" y="136" class="accent-label">rotación</text>
  <text x="420" y="152" class="accent-label">derecha</text>

  <!-- después: balanceado -->
  <text x="630" y="35" class="op">Árbol balanceado</text>
  <line x1="614.9" y1="103.2" x2="565.1" y2="146.8" class="link"/>
  <line x1="645.1" y1="103.2" x2="694.9" y2="146.8" class="link"/>
  <line x1="540.1" y1="177.4" x2="519.9" y2="212.6" class="link"/>
  <line x1="559.9" y1="177.4" x2="580.1" y2="212.6" class="link"/>
  <line x1="719.9" y1="177.4" x2="740.1" y2="212.6" class="link"/>
  <line x1="700.1" y1="177.4" x2="679.9" y2="212.6" class="ghost"/>
  <circle cx="630" cy="90" r="20" class="frame"/>
  <text x="630" y="95" class="val-sm">Y</text>
  <circle cx="550" cy="160" r="20" class="frame"/>
  <text x="550" y="165" class="val-sm">X</text>
  <circle cx="710" cy="160" r="20" class="frame"/>
  <text x="710" y="165" class="val-sm">Z</text>
  <circle cx="510" cy="230" r="17" class="frame"/>
  <text x="510" y="235" class="val-sm">T1</text>
  <circle cx="590" cy="230" r="17" class="frame"/>
  <text x="590" y="235" class="val-sm">T2</text>
  <circle cx="670" cy="230" r="17" class="ghost"/>
  <text x="670" y="236" class="ghost-val">T3</text>
  <circle cx="750" cy="230" r="17" class="frame"/>
  <text x="750" y="235" class="val-sm">T4</text>
  <text x="675" y="82" class="op">FB = 0</text>
  <text x="505" y="152" class="op">FB = 0</text>
  <text x="755" y="152" class="op">FB = 0</text>
  <text x="670" y="270" class="op">reubicado</text>
</svg>
