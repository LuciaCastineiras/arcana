<svg width="480" height="270" viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame        { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .val-sm       { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .link         { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .op           { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .op-arrow     { stroke: #777777; stroke-width: 1.5; fill: none; }
    .op-arrow-fill { fill: #777777; }
    .query        { fill: #f5f7fa; stroke: #c0742a; stroke-width: 1.8; }
    @media (prefers-color-scheme: dark) {
      .frame        { fill: #1e2330; stroke: #4a6fa5; }
      .val-sm       { fill: #e2e8f0; }
      .link         { stroke: #4a6fa5; }
      .op           { fill: #8899aa; }
      .op-arrow     { stroke: #8899aa; }
      .op-arrow-fill { fill: #8899aa; }
      .query        { fill: #1e2330; stroke: #d4884a; }
    }
  </style>

  <!-- paso 0 -->
  <text x="115" y="22" class="op">antes</text>
  <line x1="52.8" y1="65.4" x2="77.2" y2="94.6" class="link"/>
  <line x1="102.8" y1="125.4" x2="127.2" y2="154.6" class="link"/>
  <line x1="152.8" y1="185.4" x2="177.2" y2="214.6" class="link"/>
  <circle cx="40" cy="50" r="20" class="frame"/>
  <text x="40" y="55" class="val-sm">10</text>
  <circle cx="90" cy="110" r="20" class="frame"/>
  <text x="90" y="115" class="val-sm">20</text>
  <circle cx="140" cy="170" r="20" class="frame"/>
  <text x="140" y="175" class="val-sm">30</text>
  <circle cx="190" cy="230" r="20" class="query"/>
  <text x="190" y="235" class="val-sm">40</text>
  <line x1="225" y1="90" x2="295" y2="90" class="op-arrow"/>
  <path d="M295,95 L305,90 L295,85 Z" class="op-arrow-fill"/>
  <text x="265" y="78" class="op">acceder a 40</text>

  <!-- paso 1 -->
  <text x="390" y="22" class="op">después</text>
  <line x1="427.2" y1="65.4" x2="402.8" y2="94.6" class="link"/>
  <line x1="402.8" y1="125.4" x2="427.2" y2="154.6" class="link"/>
  <line x1="427.2" y1="185.4" x2="402.8" y2="214.6" class="link"/>
  <circle cx="440" cy="50" r="20" class="query"/>
  <text x="440" y="55" class="val-sm">40</text>
  <circle cx="390" cy="110" r="20" class="frame"/>
  <text x="390" y="115" class="val-sm">10</text>
  <circle cx="440" cy="170" r="20" class="frame"/>
  <text x="440" y="175" class="val-sm">30</text>
  <circle cx="390" cy="230" r="20" class="frame"/>
  <text x="390" y="235" class="val-sm">20</text>
</svg>
