<svg width="660" height="205" viewBox="0 0 660 205" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame        { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .divider      { stroke: #9baec8; stroke-width: 1; }
    .val-sm       { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .link         { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .accent-label { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .accent-arrow { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .query        { fill: #f5f7fa; stroke: #c0742a; stroke-width: 1.8; }
    @media (prefers-color-scheme: dark) {
      .frame        { fill: #1e2330; stroke: #4a6fa5; }
      .divider      { stroke: #4a6fa5; }
      .val-sm       { fill: #e2e8f0; }
      .link         { stroke: #4a6fa5; }
      .accent-label { fill: #d4884a; }
      .accent-arrow { stroke: #d4884a; }
      .query        { fill: #1e2330; stroke: #d4884a; }
    }
  </style>

  <text x="560" y="36" class="accent-label">búsqueda de la clave 75</text>

  <!-- aristas: cada hijo cuelga del borde entre claves -->
  <line x1="312" y1="50" x2="150" y2="90" class="link"/>
  <line x1="348" y1="50" x2="510" y2="90" class="accent-arrow"/>
  <line x1="114" y1="120" x2="50" y2="160" class="link"/>
  <line x1="150" y1="120" x2="150" y2="160" class="link"/>
  <line x1="186" y1="120" x2="250" y2="160" class="link"/>
  <line x1="474" y1="120" x2="410" y2="160" class="link"/>
  <line x1="510" y1="120" x2="510" y2="160" class="accent-arrow"/>
  <line x1="546" y1="120" x2="610" y2="160" class="link"/>

  <!-- nodos (camino de la búsqueda resaltado) -->
  <rect x="312" y="20" width="36" height="30" rx="6" class="query"/>
  <text x="330" y="40" class="val-sm">50</text>
  <rect x="114" y="90" width="72" height="30" rx="6" class="frame"/>
  <text x="132" y="110" class="val-sm">20</text>
  <line x1="150" y1="90" x2="150" y2="120" class="divider"/>
  <text x="168" y="110" class="val-sm">35</text>
  <rect x="474" y="90" width="72" height="30" rx="6" class="query"/>
  <text x="492" y="110" class="val-sm">70</text>
  <line x1="510" y1="90" x2="510" y2="120" class="divider"/>
  <text x="528" y="110" class="val-sm">90</text>
  <rect x="14" y="160" width="72" height="30" rx="6" class="frame"/>
  <text x="32" y="180" class="val-sm">5</text>
  <line x1="50" y1="160" x2="50" y2="190" class="divider"/>
  <text x="68" y="180" class="val-sm">10</text>
  <rect x="114" y="160" width="72" height="30" rx="6" class="frame"/>
  <text x="132" y="180" class="val-sm">25</text>
  <line x1="150" y1="160" x2="150" y2="190" class="divider"/>
  <text x="168" y="180" class="val-sm">30</text>
  <rect x="214" y="160" width="72" height="30" rx="6" class="frame"/>
  <text x="232" y="180" class="val-sm">40</text>
  <line x1="250" y1="160" x2="250" y2="190" class="divider"/>
  <text x="268" y="180" class="val-sm">45</text>
  <rect x="374" y="160" width="72" height="30" rx="6" class="frame"/>
  <text x="392" y="180" class="val-sm">55</text>
  <line x1="410" y1="160" x2="410" y2="190" class="divider"/>
  <text x="428" y="180" class="val-sm">60</text>
  <rect x="474" y="160" width="72" height="30" rx="6" class="frame"/>
  <rect x="477" y="163" width="30" height="24" rx="6" class="query"/>
  <text x="492" y="180" class="val-sm">75</text>
  <line x1="510" y1="160" x2="510" y2="190" class="divider"/>
  <text x="528" y="180" class="val-sm">80</text>
  <rect x="574" y="160" width="72" height="30" rx="6" class="frame"/>
  <text x="592" y="180" class="val-sm">95</text>
  <line x1="610" y1="160" x2="610" y2="190" class="divider"/>
  <text x="628" y="180" class="val-sm">99</text>
</svg>
